name: Build and Push to Zot
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry-taloslab.subetupaginacp.com"]
              http = true
              insecure = true
      - name: Log in to Local Zot Registry
        uses: docker/login-action@v3
        with:
          registry: registry-taloslab.subetupaginacp.com
          username: cleanup
          password: ${{ secrets.ZOT_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry-taloslab.subetupaginacp.com/palbina/mkdocs-portfolio:latest
