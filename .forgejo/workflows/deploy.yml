name: DISABLED — Build and Push to Zot (migrated to GitLab CI)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry-taloslab.subetupaginacp.com:5000"]
              http = true
              insecure = true
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry-taloslab.subetupaginacp.com:5000/palbina/mkdocs-portfolio:latest
