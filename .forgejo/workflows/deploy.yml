name: Build and Push to Zot
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Zot host alias
        run: echo "10.105.76.189 registry-taloslab.subetupaginacp.com" | tee -a /etc/hosts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry-taloslab.subetupaginacp.com:443"]
              http = false
              insecure = true
      - name: Log in to Zot
        uses: docker/login-action@v3
        with:
          registry: registry-taloslab.subetupaginacp.com
          username: cleanup
          password: ${{ secrets.ZOT_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry-taloslab.subetupaginacp.com/palbina/mkdocs-portfolio:latest
