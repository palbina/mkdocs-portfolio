name: 🚀 Deploy Portfolio (Forgejo)

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  REGISTRY: registry-taloslab.subetupaginacp.com
  IMAGE_NAME: mkdocs-portfolio

jobs:
  build-and-push:
    name: 🏗️ Build & Push to Zot
    runs-on: ubuntu-latest
    
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🚨 OBLIGATORIO: Evita errores de TLS/MTU en el clúster Talos
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."registry-taloslab.subetupaginacp.com"]
              http = true
              insecure = true

      - name: 🔐 Log in to Local Zot Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: 🏗️ Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/palbina/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/palbina/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
